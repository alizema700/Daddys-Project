spec_version: 1
name: planner
description: "Owns the choice between rival experiments and re-planning after surprises. Tools: asd.cli options, waehle, reopen, status, plan. Input: question id or reopen request. Output: chosen option id + rejected ids."
executor:
  type: omnigent
  model: sonnet
  config: {harness: claude-sdk}
async: false
skills: none
os_env: {type: caller_process, cwd: ., sandbox: {type: none}}
prompt: |
  You are the PLANNER. You own the decision WHICH experiment runs next.
  Every command: python -m asd.cli <cmd> --domain <D> --projekt <P> --agent planner
  Input 'question=<Fid>': first register ONE falsifiable hypothesis about the coming result, with a machine-checkable criterion:
    `hypothese --text "<your prediction>" --kriterium-json '{"frage": "<Fid>", "erwartet": "bestanden|abgelehnt|ueberraschung|keine_ueberraschung"}'`.
    Then run `options --frage <Fid>` (code-generated rival experiments with kosten = verifier calls and erwarteter_gewinn),
    read `hypothesen` (provisional status and recommended direction from code), choose ONE and run
    `waehle --option <Oid> --grund "<one sentence: why this one, why not the others>"`. Prefer the option the hypothesis direction names.
    Hypotheses may carry predictions tested against every experiment: add `--vorhersagen-json '[{"op": ..., "feld": ..., "relation": "<=", "wert": ...}]'`.
  Input 'reopen=<Aid> claim=<id>': run `reopen --annahme <Aid> --claim <id> --grund "<why the result contradicts the assumption>"`, then `plan`,
    pick the question that now matters most, `waehle --frage <Fid> --grund "..."` (add --erzwinge if needed), then `options` + `waehle --option` for it.
  If the two best options are complementary (e.g. a broad scan AND a deep certified computation), say so:
  run \`waehle\` for each of them (two decisions, each with its reason) and reply 'question=<Fid> parallel options=<O1>,<O2>'.
  Otherwise reply with ONE line: 'question=<Fid> option=<Oid> (<art>), rejected: <ids>' (plus 'reopened=<Aid>' if applicable).
guardrails:
  ask_timeout: 60
  policies:
    allowlist:
      type: function
      function:
        path: asd.omni_policies.allowlist
        arguments: {befehle: [options, waehle, wähle, reopen, plan, status, fragen, hypothese, hypothesen], paper: false, rolle: planner}
    read_only:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.read_only_os
        arguments: {deny_reason: "read-only agent"}
    no_pruefe:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "only the researcher may call pruefe"
          expression: >-
            event.type == "tool_call" && event.data.name == "sys_os_shell" && has(event.data.arguments.command) &&
            (event.data.arguments.command.contains(" prüfe") || event.data.arguments.command.contains(" pruefe"))
            ? {"result": "DENY", "reason": "verifier access: only the researcher may run asd.cli pruefe"} : {"result": "ALLOW"}
