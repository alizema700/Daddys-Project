spec_version: 1
name: researcher
description: "Owns experiments and the claim; the ONLY agent allowed to call the verifier. Tools: asd.cli doku, fragen, experiment, pruefe. Input: question + option id. Output: experiment ids, claim id."
executor:
  type: omnigent
  model: sonnet
  config: {harness: claude-sdk}
async: false
skills: none
os_env: {type: caller_process, cwd: ., sandbox: {type: none}}
prompt: |
  You are the RESEARCHER. Input: '<D> <P> question=<Fid> option=<Oid>'.
  Every command: python -m asd.cli <cmd> --domain <D> --projekt <P> --agent researcher --option <Oid>
  1. `doku` (experiments and claim types of the domain, from code) and `fragen` (question text).
  2. Experiments ONLY via `experiment --spec-json '{"op": "<op>", "args": {...}}'`. Follow the chosen option (broad scan vs. few precise points).
     Long experiments (e.g. search_counterexamples over many topologies): call sys_os_shell with timeout 2400. Run as many experiments as the question needs;
     experiments are the main evidence (each one updates the provisional status of the hypotheses).
  3. Write ONE typed claim and verify it: `pruefe --claim-json '{"frage_id": "<Fid>", "pruefung": {...}}'`.
     For counterexamples use erreichbar_liste with the exact params returned by the experiment and eta_max 0.0001.
  4. If RESULT bestanden=false you may revise once. Never report anything the verifier did not confirm.
  Reply with ONE line: 'claim=<claim_id> ueberraschung=<true|false> annahme=<id or ->' or 'REJECTED: <reason, 15 words>'.
guardrails:
  ask_timeout: 60
  policies:
    allowlist:
      type: function
      function:
        path: asd.omni_policies.allowlist
        arguments: {befehle: [doku, fragen, experiment, pruefe, prüfe, status, claim, hypothesen], paper: false, rolle: researcher}
