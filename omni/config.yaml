# Verifier-Gated Discovery Lab unter Omnigent. Lead-Agent (Principal Investigator).
# Grundsatz: Agents propose, Omnigent orchestrates, only the code verifier accepts.
# Start (aus dem Repo-Root!):
#   python -m asd.omni_setup --quelle proofreading --projekt omni_proofreading
#   omnigent run omni -p "Domain proofreading, project omni_proofreading, start question F20, 3 rounds."
spec_version: 1
name: verifier-gated-lab
description: Principal investigator of a verifier-gated lab; runs evidence -> options -> choice -> experiment -> verification -> red team -> follow-ups.
executor:
  type: omnigent
  model: opus
  config: {harness: claude-sdk}
async: true
cancellable: true
timers: true
tools:
  agents: [scout, planner, researcher, redteam, learner, scribe]
prompt: |
  You are the PRINCIPAL INVESTIGATOR of a verifier-gated research lab. Truth lives in Python, never in an LLM: every lab action is
  `python -m asd.cli <command> --domain <D> --projekt <P> --agent <name>`, run by a specialist; every action is appended to
  projects/<P>/record.jsonl (its FIRST entry is the sha256 of the preregistration). You have NO shell and NO compute tools by design:
  you only dispatch specialists and read their results. Only the researcher can run `asd.cli pruefe`, the only way to confirm a claim.

  Start: dispatch scout with "<D> <P> policy-check" (it deliberately tries a hold-out read and a direct state write; both must be DENIED).
  One round:
    1. planner: "<D> <P> question=<Fid>" -> it reads status, registers ONE falsifiable hypothesis with a machine-checkable criterion
       (`asd.cli hypothese`), runs `options`, and chooses (`waehle`). Dispatch scout ("<D> <P>") in the same turn (parallel).
    2. researcher: "<D> <P> question=<Fid> option=<Oid>" -> claim id or REJECTED. RIVAL EXPERIMENTS IN PARALLEL: if the planner reports two
       complementary options, dispatch TWO researcher sessions in the same turn, one per option.
    3. If a claim id came back: redteam ("<D> <P> claim=<id>") AND learner ("<D> <P> aus=<claim id>") in the same turn (parallel).
    4. Decide the next round and say why in one line. There is no budget limit: keep going while rounds produce new claims
       or move a hypothesis (see HYPOTHESIS RULE).
  HYPOTHESIS RULE: hypotheses carry a PROVISIONAL status computed by code from experiment results (`asd.cli hypothesen`).
       The planner follows the direction it reports: testen -> experiments that test the predictions; beweisen -> the certifying
       claim (Lean proof where the domain offers one); entscheiden -> a decisive experiment; verfeinern -> a restricted, refined claim.
  SELF-REFUTATION RULE: if the result reports "hypothese_widerlegt", say so explicitly ("the lab refuted its own hypothesis Hn"), and have
  the planner re-plan (new question or reopen) BEFORE the next round. SURPRISE RULE: on "ueberraschung": true, planner runs `reopen`.
  THREAD RULE: stay in the thread until 2 rounds without a new confirmed claim; topic switch only via planner `waehle --frage`.
  POLICY RULE: if a specialist was denied or paused by a policy, do not assume its work happened; ask it.
  After the last round dispatch scribe ("<D> <P>"): the paper needs every new claim to carry a red-team vote (policy) and HUMAN approval (ASK).
  Pass ONLY ids and one-line results between agents. Max 3 dispatches per turn (sys_session_send(agent=<name>, title=<short task>, args="<ids>")).
  Finish with 6 lines: rounds, confirmed claim ids, refuted hypotheses / reopened assumptions, rejected attempts, policy denials/asks, next experiment + reason.
guardrails:
  ask_timeout: 7200
  policies:
    loop_guard:
      type: function
      function:
        path: asd.omni_policies.loop_guard
        arguments: {max_wiederholungen: 5, ignoriere: [sys_read_inbox]}
    publish_requires_votes:
      type: function
      function:
        path: asd.omni_policies.publish_requires_votes
        arguments: {}
    no_resubmission:
      type: function
      function:
        path: asd.omni_policies.no_resubmission
        arguments: {}
    claim_phrases_ask:
      type: function
      function:
        path: asd.omni_policies.claim_phrases_ask
        arguments: {}
    spawn_bounds:
      type: function
      function:
        path: omnigent.policies.builtins.orchestration.spawn_bounds
        arguments: {max_dispatches_per_turn: 3, dispatch_tools: [sys_session_send]}
    verifier_only:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "verifier_only: claims/state are written only by `python -m asd.cli prüfe`"
          expression: >-
            event.type == "tool_call" && (
              (event.data.name == "sys_os_shell" && has(event.data.arguments.command) &&
                (event.data.arguments.command.contains("state.json") ||
                 event.data.arguments.command.contains("omni_record.jsonl") ||
                 event.data.arguments.command.matches("(>|tee |cp |mv |rm |sed -i).*projects/"))) ||
              (event.data.name in ["sys_os_write", "sys_os_edit"] && has(event.data.arguments.path) &&
                (event.data.arguments.path.contains("projects/") || event.data.arguments.path.contains("state.json")))
            ) ? {"result": "DENY", "reason": "verifier_only: direct write to lab state; use `python -m asd.cli prüfe`"} : {"result": "ALLOW"}
    leak_guard:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "leak_guard"
          # Gesperrte Pfade/Begriffe (Replay-Lauf): gleiche Liste wie omni/leak_guard.json
          expression: >-
            event.type == "tool_call" && event.data.name in ["sys_os_shell", "sys_os_read"] && (
              ["projects/proofreading_test", "projects/proofreading/", "research/kb", "research/", "literature/", "benchmarks/", "results/", "cache/", "projects/lattice/",
               "docs/", "README", "prereg.md", "asd/domains", "asd/verify", "suleman", "Suleman", "2609."].exists(t,
                 (has(event.data.arguments.command) && event.data.arguments.command.contains(t)) ||
                 (has(event.data.arguments.path) && event.data.arguments.path.contains(t)))
            ) ? {"result": "DENY", "reason": "leak_guard: blocked source (hold-out results / answer key / pre-cutoff literature)"} : {"result": "ALLOW"}
    harness_only:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "harness_only"
          expression: >-
            event.type == "tool_call" && event.data.name == "sys_os_shell" && has(event.data.arguments.command) &&
            !event.data.arguments.command.matches("^\\s*(cd [^;|&`$\\n]+ && )?(python3?|/usr/local/bin/python3?) -m asd\\.(cli|paper)( [^;|&`$\\n]*)?$")
            ? {"result": "DENY", "reason": "harness_only: agents may only call the frozen harness (python -m asd.cli / asd.paper)"} : {"result": "ALLOW"}
    publish_gate:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "publish_gate"
          expression: >-
            event.type == "tool_call" && event.data.name == "sys_os_shell" && has(event.data.arguments.command) &&
            (event.data.arguments.command.contains("asd.paper") || event.data.arguments.command.contains("git push"))
            ? {"result": "ASK", "reason": "publish_gate: building/publishing the paper needs human approval"} : {"result": "ALLOW"}
    read_only_lead:
      type: function
      function:
        path: omnigent.policies.builtins.cel.cel_policy
        arguments:
          reason: "lead is read-only"
          expression: >-
            event.type == "tool_call" && event.data.name in ["sys_os_write", "sys_os_edit"]
            ? {"result": "DENY", "reason": "no agent writes files directly; all lab writes go through asd.cli"} : {"result": "ALLOW"}
