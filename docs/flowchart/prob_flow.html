<title>prob Architecture Flow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: one 16:9 stage with a camera that zooms to the part being explained; captions overlay; controls underneath.
   One typeface, one neutral card style for all agents; only the verifier carries the accent. Single deliberate dark look. */
:root{
  color-scheme: dark;
  --bg:#060C17;
  --fg:#EEF3F8; --muted:#8C98AA; --faint:#5A667B;
  --card:rgba(255,255,255,.045); --card-hi:rgba(255,255,255,.08); --stroke:rgba(255,255,255,.11); --tile:rgba(255,255,255,.07);
  --accent:#2BC4D6; --no:#E5615F; --amber:#E3A93C;
  --font:"Instrument Sans", -apple-system, "SF Pro Display", system-ui, sans-serif;
}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--font);padding-inline:16px;padding-block:24px 40px;
  background:radial-gradient(1200px 600px at 70% 10%, rgba(43,196,214,.09), transparent 60%),var(--bg)}
.wrap{max-width:1280px;margin:0 auto;display:grid;gap:18px}
.stage{position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--stroke);background:var(--bg);
  box-shadow:0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.06)}
.stage svg{display:block;width:100%;height:auto;aspect-ratio:16/9}
.cap{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);max-width:80%;text-align:center;
  font:500 clamp(13px,1.9vw,24px)/1.35 var(--font);letter-spacing:-.01em;color:var(--fg);
  padding:.55em 1.1em;border-radius:999px;background:rgba(6,12,23,.72);border:1px solid var(--stroke);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .6s ease, transform .6s ease}
.cap.show{opacity:1}
.stage:fullscreen{border-radius:0;border:0;display:flex;align-items:center}
.stage:fullscreen svg{max-height:100vh}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.bar p{margin:0;color:var(--muted);font-size:.9rem;max-width:62ch;line-height:1.5}
.btns{display:flex;gap:8px;flex-wrap:wrap}
button{font:500 .9rem var(--font);color:var(--fg);background:var(--card-hi);border:1px solid var(--stroke);border-radius:999px;padding:9px 16px;cursor:pointer}
button.primary{background:linear-gradient(180deg,#36C8DA,#1C9CB8);color:#04121A;border-color:transparent;font-weight:600}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* SVG type: one family, hierarchy by size and weight only */
svg text{font-family:var(--font)}
.t-eye{font-size:13px;font-weight:600;letter-spacing:.14em;fill:var(--accent)}
.t-h{font-size:48px;font-weight:700;letter-spacing:-.03em;fill:var(--fg)}
.t-h2{font-size:48px;font-weight:700;letter-spacing:-.03em;fill:var(--accent)}
.t-name{font-size:17px;font-weight:600;fill:var(--fg)}
.t-role{font-size:12.5px;fill:var(--muted)}
.t-edge{font-size:11.5px;font-weight:500;fill:var(--muted)}
.t-kpi{font-size:30px;font-weight:700;fill:var(--fg);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.t-kpil{font-size:11.5px;fill:var(--muted)}
.t-band{font-size:11px;font-weight:600;letter-spacing:.12em;fill:var(--faint)}
.t-chip{font-size:11.5px;font-weight:500;fill:var(--fg)}
.node rect.box{fill:var(--card);stroke:var(--stroke);transition:fill .4s, stroke .4s}
.node.lit rect.box{fill:var(--card-hi);stroke:var(--accent)}
.ico{fill:none;stroke:var(--fg);stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.edge{fill:none;stroke:rgba(255,255,255,.22);stroke-width:1.6;transition:stroke .3s}
.edge.no{stroke:var(--no);stroke-opacity:.75;stroke-dasharray:5 5}
.edge.sur{stroke:var(--amber);stroke-opacity:.8;stroke-dasharray:5 5}
.edge.on{stroke:var(--accent);stroke-opacity:1}
.pulse{fill:#BFF6FF;filter:url(#soft)}
@media (prefers-reduced-motion: reduce){ .pulse{display:none} .cap{transition:none} }
</style>

<div class="wrap">
<div class="stage" id="stage">
<svg id="flow" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="ttl dsc">
<title id="ttl">prob technical architecture</title>
<desc id="dsc">A research question goes to the lead agent, which dispatches planner and scout in parallel. The researcher runs the chosen experiment and submits a typed claim. Only the code verifier accepts; rejections return a reason, surprises reopen an assumption. Certified claims are attacked by the red team; the learner proposes follow-up questions back to the lead. A human approves publishing before the scribe writes the paper. Omnigent policies constrain every agent, and every step is logged in a hash-chained record exported to Databricks and re-checkable in the browser.</desc>
<defs>
  <radialGradient id="bgGlow" cx="68%" cy="34%" r="60%"><stop offset="0" stop-color="#0F4C5C" stop-opacity=".5"/><stop offset="1" stop-color="#060C17" stop-opacity="0"/></radialGradient>
  <linearGradient id="bgLin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1A2C"/><stop offset="1" stop-color="#060C17"/></linearGradient>
  <linearGradient id="verG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36C8DA" stop-opacity=".22"/><stop offset="1" stop-color="#1A8FB0" stop-opacity=".08"/></linearGradient>
  <filter id="soft" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="halo" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
  <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.6"/></marker>
  <marker id="arwN" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#E5615F" stroke-width="1.6"/></marker>
  <marker id="arwS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#E3A93C" stroke-width="1.6"/></marker>
</defs>

<rect x="-400" y="-300" width="2400" height="1500" fill="url(#bgGlow)"/>

<text x="60" y="118"><tspan class="t-h">Agents propose.</tspan><tspan class="t-h2" dx="14">Only code accepts.</tspan></text>

  <path id="e-lead-plan" class="edge" d="M460 300 C 495 300 485 230 520 230" marker-end="url(#arw)"/>
  <path id="e-lead-scout" class="edge" d="M460 300 C 495 300 485 370 520 370" marker-end="url(#arw)"/>
  <path id="e-plan-res" class="edge" d="M690 230 C 725 230 715 300 750 300" marker-end="url(#arw)"/>

<text class="t-edge" x="955" y="288" text-anchor="middle">claim</text>

<text class="t-edge" x="968" y="466" text-anchor="middle" style="fill:var(--no)">reject · reason returned · no resubmission</text>
<text class="t-edge" x="1410" y="440">every result attacked</text>
<text class="t-edge" x="680" y="582" text-anchor="middle">follow-up questions: generalise › edge case › counterexample</text>
<text class="t-edge" x="1410" y="630">confirmed</text>

<g id="nodes"></g>

  <rect x="975" y="225" width="250" height="150" rx="34" fill="#22B3C9" opacity=".18" filter="url(#halo)"/>
  <rect class="box" x="990" y="240" width="220" height="120" rx="26" style="fill:url(#verG);stroke:#2BC4D6;stroke-width:1.4"/>
  <circle cx="1024" cy="274" r="16" fill="#2BC4D6"/>
  <path d="M1017 274 l5 5 l9 -10" fill="none" stroke="#04121A" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t-name" x="1050" y="280">Verifier</text>

  <rect x="1306" y="294" width="12" height="12" rx="2" fill="#2BC4D6"/>
  <text class="t-name" x="1342" y="295">Certificate</text>

<g transform="translate(60,640)">
  <text class="t-band" x="0" y="0">EVIDENCE LEVELS</text>

  <g transform="translate(0,66)">
    <line x1="0" y1="0" x2="26" y2="0" stroke="#E5615F" stroke-dasharray="5 5" stroke-width="1.6"/><text class="t-role" x="34" y="4">rejected</text>
    <line x1="110" y1="0" x2="136" y2="0" stroke="#E3A93C" stroke-dasharray="5 5" stroke-width="1.6"/><text class="t-role" x="144" y="4">surprise · human gate</text>
    <circle cx="300" cy="0" r="5" fill="#BFF6FF" filter="url(#soft)"/><text class="t-role" x="312" y="4">handoff with ids</text>
  </g>
</g>

<g transform="translate(60,770)">
  <rect width="700" height="96" rx="20" fill="rgba(255,255,255,.03)" stroke="var(--stroke)"/>
  <text class="t-band" x="22" y="28">OMNIGENT POLICIES · CONSTRAIN EVERY AGENT</text>
  <g id="chips-pol" transform="translate(22,54)"></g>
</g>
<g transform="translate(790,770)">
  <rect width="750" height="96" rx="20" fill="rgba(255,255,255,.03)" stroke="var(--stroke)"/>
  <text class="t-band" x="22" y="28">SHARED RECORD · ANYONE CAN RE-CHECK</text>
  <g id="chips-rec" transform="translate(22,54)"></g>
</g>

<circle id="pulse" class="pulse" r="5" cx="-20" cy="-20"/>
</svg>
<div class="cap" id="cap" aria-live="polite"></div>
</div>

<div class="bar">
  <p>One research round. Agents act only through the frozen harness asd.cli; every call is a line in a hash-chained record.jsonl. Numbers from results/FROZEN.json. “Guided tour” zooms into each part in turn.</p>
  <div class="btns">
    <button id="tour" class="primary" type="button">Guided tour</button>
    <button id="play" type="button">Play round</button>
    <button id="full" type="button">Fullscreen</button>
  </div>
</div>
</div>

<script>
const NS="http://www.w3.org/2000/svg", svg=document.getElementById("flow");
// Monoline icons on a 20×20 grid; every agent shares one card style and is told apart by its glyph.
const ICON={
 q:'<path d="M3 4h14v10H9l-4 3v-3H3z"/><path d="M8.3 7.6a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1"/><circle cx="10" cy="12" r=".4"/>',
 lead:'<path d="M5 17V3"/><path d="M5 4h10l-2.5 3.5L15 11H5"/>',
 plan:'<path d="M3 6h14M3 14h14"/><circle cx="7" cy="6" r="2"/><circle cx="13" cy="14" r="2"/>',
 scout:'<circle cx="8.5" cy="8.5" r="5"/><path d="M12.3 12.3 17 17"/>',
 res:'<path d="M7.5 3h5M8.5 3v5L4 16a1 1 0 0 0 .9 1.5h10.2A1 1 0 0 0 16 16l-4.5-8V3"/><path d="M6 12.5h8"/>',
 red:'<circle cx="10" cy="10" r="6"/><circle cx="10" cy="10" r="2"/><path d="M10 1.5v3M10 15.5v3M1.5 10h3M15.5 10h3"/>',
 learn:'<path d="M16 9a6 6 0 1 1-1.8-4.3"/><path d="M15 2v3.5h-3.5"/>',
 sci:'<circle cx="10" cy="6.5" r="3"/><path d="M4 17c.8-3.4 3.2-5 6-5s5.2 1.6 6 5"/>',
 scribe:'<path d="M4 16l1.5-5L13 3.5l3.5 3.5L9 14.5z"/><path d="M11.5 5l3.5 3.5"/>',
 paper:'<path d="M5 2.5h7l3.5 3.5v11.5H5z"/><path d="M12 2.5V6h3.5M7.5 10h5M7.5 13h5"/>'
};
const N=[ // id, x, y, w, label, role, human?
 ["q",60,262,170,"Question","research goal",1],
 ["lead",290,262,170,"Lead","picks the next step"],
 ["plan",520,192,170,"Planner","weighs gain vs. cost"],
 ["scout",520,332,170,"Scout","finds evidence"],
 ["res",750,262,170,"Researcher","runs experiments"],
 ["red",1315,522,170,"Red team","tries to refute"],
 ["learn",975,522,170,"Learner","new questions"],
 ["sci",1315,646,170,"Scientist","human approval",1],
 ["scribe",1095,646,170,"Scribe","writes the paper"],
 ["paper",875,646,170,"Paper","numbers = claim ids"]
];
const g=document.getElementById("nodes");
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||g).appendChild(e);return e}
for(const [id,x,y,w,lab,role,human] of N){
  const h=76,n=el("g",{class:"node",id:"n-"+id});
  el("rect",{class:"box",x,y,width:w,height:h,rx:18,style:human?"stroke-dasharray:4 4;stroke:rgba(227,169,60,.55)":""},n);
  el("circle",{cx:x+32,cy:y+38,r:17,fill:"var(--tile)",stroke:"rgba(255,255,255,.14)"},n);
  const ic=el("g",{class:"ico",transform:`translate(${x+22},${y+28})`},n);ic.innerHTML=ICON[id];
  const t1=el("text",{class:"t-name",x:x+60,y:y+34},n);t1.textContent=lab;
  const t2=el("text",{class:"t-role",x:x+60,y:y+53},n);t2.textContent=role;
  if(t2.getComputedTextLength()>w-70)t2.style.fontSize="11.5px";
}
function chips(id,list,max){
  const p=document.getElementById(id);let x=0,y=0;
  for(const [txt,kind] of list){
    const t=el("text",{class:"t-chip",y:y+1,"text-anchor":"middle"},p);t.textContent=txt;
    const w=t.getComputedTextLength()+24; if(x+w>max){x=0;y+=28;t.setAttribute("y",y+1)}
    const r=el("rect",{x,y:y-14,width:w,height:22,rx:11,
      fill:kind==="deny"?"rgba(229,97,95,.12)":kind==="ask"?"rgba(227,169,60,.14)":kind==="acc"?"rgba(43,196,214,.14)":"rgba(255,255,255,.05)",
      stroke:kind==="deny"?"rgba(229,97,95,.5)":kind==="ask"?"rgba(227,169,60,.55)":kind==="acc"?"rgba(43,196,214,.5)":"rgba(255,255,255,.12)"},p);
    p.insertBefore(r,t);t.setAttribute("x",x+w/2);x+=w+8;
  }
}
chips("chips-lvl",[["proved in Lean","acc"],["computed rigorous","acc"],["statistical","x"],["observed","x"]],600);
chips("chips-pol",[["DENY harness only","deny"],["DENY verifier only","deny"],["DENY leak guard","deny"],["only researcher submits","deny"],["ASK publish gate","ask"],["cost budget 40 USD","ask"],["≤3 parallel dispatches","x"],["no resubmission","x"]],656);
chips("chips-rec",[["record.jsonl · sha256 hash chain","x"],["Databricks Delta + MLflow","x"],["re-verify in browser","x"],["MCP server probatum","x"],["preregistered","x"]],706);

/* ---------- motion ---------- */
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
const easeIO=t=>t<.5?16*t**5:1-Math.pow(-2*t+2,5)/2;          // quintic in-out: slow start, slow landing
const easeE=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const arrive={"e-q-lead":"lead","e-lead-plan":"plan","e-lead-scout":"scout","e-plan-res":"res","e-scout-res":"res","e-res-ver":"ver","e-rej":"res","e-sur":"plan","e-ver-cert":"cert","e-cert-red":"red","e-red-learn":"learn","e-learn-lead":"lead","e-red-sci":"sci","e-sci-scribe":"scribe","e-scribe-paper":"paper"};
let vb=[0,0,1600,900];
function setVB(b){vb=b;svg.setAttribute("viewBox",b.map(v=>v.toFixed(2)).join(" "))}
function camera(to,dur=1800){ if(reduce){setVB(to);return Promise.resolve()}
  const from=vb.slice();return new Promise(r=>{const t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/dur),e=easeIO(k);
   // interpolate the zoom in log space so scale changes feel constant-speed
   const w=Math.exp(Math.log(from[2])+(Math.log(to[2])-Math.log(from[2]))*e), h=w*9/16;
   const cx=(from[0]+from[2]/2)+((to[0]+to[2]/2)-(from[0]+from[2]/2))*e, cy=(from[1]+from[3]/2)+((to[1]+to[3]/2)-(from[1]+from[3]/2))*e;
   setVB([cx-w/2,cy-h/2,w,h]); k<1?requestAnimationFrame(f):r()})(t0)})}
function animEdge(id,dur=1100){return new Promise(r=>{const p=document.getElementById(id),L=p.getTotalLength();p.classList.add("on");
  if(reduce){setTimeout(()=>{p.classList.remove("on");r()},300);return}
  const dot=el("circle",{class:"pulse",r:5},svg);const t0=performance.now();
  (function f(now){const k=Math.min(1,(now-t0)/dur),pt=p.getPointAtLength(easeE(k)*L);dot.setAttribute("cx",pt.x);dot.setAttribute("cy",pt.y);
   if(k<1)requestAnimationFrame(f);else{p.classList.remove("on");dot.remove();const n=document.getElementById("n-"+arrive[id]);
   if(n){n.classList.add("lit");setTimeout(()=>n.classList.remove("lit"),900)}r()}})(t0)})}
async function run(steps){for(const s of steps){await Promise.all(s.map(id=>animEdge(id)));await wait(160)}}
const capEl=document.getElementById("cap");
async function caption(t){capEl.classList.remove("show");await wait(350);capEl.textContent=t;if(t)capEl.classList.add("show")}
const W=(x,y,w)=>[x,y,w,w*9/16];
const TOUR=[
 {cam:W(0,0,1600),cap:"Agents propose. Only code accepts.",steps:[],hold:2200},
 {cam:W(30,150,760),cap:"A question goes to the lead agent.",steps:[["e-q-lead"]],hold:900},
 {cam:W(400,110,680),cap:"Planner and scout run in parallel. The planner weighs gain against verifier cost.",steps:[["e-lead-plan","e-lead-scout"],["e-plan-res","e-scout-res"]],hold:900},
 {cam:W(720,110,860),cap:"The researcher submits a claim. Only the verifier can accept it.",steps:[["e-res-ver"],["e-ver-cert"]],hold:1100},
 {cam:W(560,95,720),cap:"A rejection returns its reason. A surprise reopens an assumption.",steps:[["e-res-ver"],["e-rej"],["e-res-ver"],["e-sur"]],hold:900},
 {cam:W(320,200,1240),cap:"A red team attacks every result. The learner turns it into new questions.",steps:[["e-cert-red"],["e-red-learn"],["e-learn-lead"]],hold:900},
 {cam:W(840,470,700),cap:"Publishing waits for a human. Every number in the paper is a claim id.",steps:[["e-red-sci"],["e-sci-scribe"],["e-scribe-paper"]],hold:1100},
 {cam:W(30,450,800),cap:"Policies bound what each agent can touch.",steps:[],hold:2600},
 {cam:W(770,450,800),cap:"Every step lands in a hash-chained record anyone can re-check.",steps:[],hold:2600},
 {cam:W(0,0,1600),cap:"",steps:[],hold:400}
];
let busy=false;
function lock(on){busy=on;for(const b of ["tour","play"])document.getElementById(b).disabled=on}
async function tour(){if(busy)return;lock(true);
  for(const s of TOUR){await Promise.all([camera(s.cam),caption(s.cap)]);await wait(250);await run(s.steps);await wait(s.hold)}
  lock(false)}
async function round(){if(busy)return;lock(true);await camera(W(0,0,1600),1200);
