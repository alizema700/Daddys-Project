<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guided tour</title><style>
:root{--bg:#fafaf7;--fg:#1d1d1b;--mut:#6b6b66;--acc:#2f5d50;--card:#fff;--line:#e3e1da}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--fg:#ecebe6;--mut:#a3a29c;--acc:#7fb8a4;--card:#1e1e1c;--line:#33332f}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:24px 16px}
h1{font-size:20px;margin:0 0 4px}.sub{color:var(--mut);font-size:14px;margin-bottom:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 20px}.bar>div{height:100%;background:var(--acc);transition:width .4s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px}
.k{font-size:13px;color:var(--acc);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.t{font-size:22px;font-weight:650;margin:4px 0 12px}.x{white-space:pre-wrap;word-break:break-word}
.meta{color:var(--mut);font-size:14px;margin-top:12px}.meta a{color:var(--acc)}
nav{display:flex;gap:8px;margin-top:16px;align-items:center}button{font:inherit;padding:8px 16px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
button.p{background:var(--acc);color:#fff;border-color:var(--acc)}
.seal{border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:14px;background:var(--card)}.seal b{color:var(--acc)}.seal.bad b{color:#b3261e}.hint{color:var(--mut);font-size:13px;margin-left:auto}
</style></head><body><main>
<h1>Guided tour: one recorded Omnigent run</h1><div class="sub">runs/omnigent/2026-10-04 · six beats extracted automatically from record.jsonl and the session logs (python -m asd.beats)</div>
<div class="seal" id="seal"></div>
<div class="bar"><div id="bar"></div></div>
<div class="card"><div class="k" id="k"></div><div class="t" id="t"></div><div class="x" id="x"></div><div class="meta" id="m"></div></div>
<nav><button id="prev">Back</button><button class="p" id="next">Next</button><span class="hint">keys: ← → · r = auto play</span></nav>
</main><script>
const B=[{"beat": "Question", "zeit": "04:20:36", "ids": ["F20"], "text": "Task: Domain proofreading, project omni_proofreading, start question F20, 3 rounds. Goal: decide more of the 35 open topologies of the two-bound-state family (exact counterexample certificate or proof), within the verifier bud | Question F20: Gibt es unter den 35 offenen Topologien der Familie mit höchstens zwei gebundenen Zuständen (fam2_*) weitere, die eta <= e^{-2 Delta} = 1e-4 erreichen (exaktes Zertifikat erreichbar_liste), oder lässt sich die Schranke für weitere Mitglieder beweisen?", "beleg": ["lead__69b219d2.jsonl", "prereg.md"], "bildschirm": "Omnigent terminal with the start prompt; prereg.md"}, {"beat": "Agent handoffs", "zeit": "04:20:49", "ids": ["O2"], "text": "Lead dispatches in parallel: planner (proofreading omni_proofreading question=F20) + scout (proofreading omni_proofreading). Planner chooses O2 for F20: O2 has the higher expected gain (0.65 vs 0.35) at 1 verifier call versus 3 for O1; the budget is ample (40 of 40 left), but the cheaper, deeper check is still the better use of it.", "beleg": ["record.jsonl", "decisions.md", "HIGHLIGHTS.md"], "bildschirm": "HIGHLIGHTS.md rows 'Parallel dispatch' and 'Choice between options'; decisions.md"}, {"beat": "Experiment", "zeit": "04:25:09", "ids": ["E3"], "text": "researcher runs search_counterexamples (E3, option O2): {'unter_schwelle': [{'topologie': 'fam2_9', 'eta': 2.000855568147094e-05, 'params': {'verw_C0_E+': 4.748790448167281, 'verw_C0_E-': 5.974755498486219, 'bind_C1_E+': 0.17888541085133824, 'bind_C1_E-': 7.149508249891922, 'umw1r_C1_C0+': 2.832", "beleg": ["record.jsonl"], "bildschirm": "researcher session: asd.cli experiment call and its result"}, {"beat": "Result", "zeit": "04:25:45", "ids": ["proofreading-O14"], "text": "Verifier accepts proofreading-O14 (computed_rigorous): Zertifikat (a) für 10/10 Fälle bestanden", "beleg": ["record.jsonl", "state.json"], "bildschirm": "RESULT line of asd.cli pruefe"}, {"beat": "What the lab learned", "zeit": "04:25:30", "ids": ["proofreading-O14", "A1"], "text": "Rejected by the verifier: Zertifikat (a) für 10/11 Fälle bestanden; nicht bestanden: [('fam2_13', 'Rate außerhalb [e^-10, e^10] (|log k| = 10.06; auch abgeleitete Rückraten zählen')] | Surprise against assumption A1: neue zertifizierte Verletzung(en) ['fam2_35', 'fam2_39', 'fam2_41', 'fam2_43', 'fam2_45', 'fam2_58', 'fam2_67', 'fam2_75'] ausserhalb der angenommenen Menge ['f | Planner reopens A1 -> new question(s) ['F21']", "beleg": ["record.jsonl", "decisions.md (REOPEN)"], "bildschirm": "decisions.md REOPEN row; RESULT with ueberraschung: true"}, {"beat": "Next experiment", "zeit": "04:28:26", "ids": [], "text": "The planner picked F24 with option O2 (tiefe_rechnung) and rejected O1. The round 3 researcher is dispatched on that. Redteam on O15 is still outstanding. I'm waiting on both.", "beleg": ["lead__69b219d2.jsonl"], "bildschirm": "lead summary in the Omnigent session"}], RUN="runs/omnigent/2026-10-04", T={"omnigent_session_id": "69b219d241fe4bb29cd74c2385358ebf", "verification": {"passed": true, "fehlschlaege": [], "handoffs": 14, "quittungen": 4, "deny": 14, "ask": 1, "ask_freigegeben": 1}, "hash_kette": "hash chain intact (82 links, head 1fcb11696c9a)"};let i=0,auto=null;
(function(){const e=document.getElementById('seal');if(!T){e.style.display='none';return}const v=T.verification;
e.className='seal'+(v.passed?'':' bad');e.innerHTML=`<b>${v.passed?'✓ Verified trace':'✗ Trace check failed'}</b> · Omnigent session ${T.omnigent_session_id.slice(0,8)} · ${v.handoffs} handoffs (sha256 of message and inbox entry) · ${v.quittungen} verifier receipts · ${v.deny} policy DENY · ${v.ask_freigegeben}/${v.ask} ASK approved by a human · ${T.hash_kette} · <a href="../${RUN}/trace.json">trace.json</a>`+(v.passed?'':' · failures: '+v.fehlschlaege.join('; '))})();
function show(){const b=B[i];document.getElementById('k').textContent=`Beat ${i+1} of ${B.length} · ${b.zeit} (Zurich)`;
document.getElementById('t').textContent=b.beat;document.getElementById('x').textContent=b.text;
document.getElementById('m').innerHTML='Evidence: '+b.beleg.map(f=>`<a href="../${RUN}/${f.split(' ')[0]}">${f}</a>`).join(' · ')+(b.ids.length?' · ids: '+b.ids.join(', '):'');
document.getElementById('bar').style.width=((i+1)/B.length*100)+'%';}
function go(d){i=Math.max(0,Math.min(B.length-1,i+d));show();}
document.getElementById('next').onclick=()=>go(1);document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);
if(e.key==='r'){if(auto){clearInterval(auto);auto=null}else{i=0;show();auto=setInterval(()=>{if(i>=B.length-1){clearInterval(auto);auto=null}else go(1)},7000)}}});
show();</script></body></html>
